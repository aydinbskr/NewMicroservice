
services:
  newmicroservice.basket.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/udemyTenant 
      - IdentityOption:Issuer=http://keycloak:8080/realms/udemyTenant
      - ConnectionStrings:Redis=redis.db.basket:6379,password=Password12 
    ports:
      - "8080"
    depends_on:
      - redis.db.basket
      - rabbitmq
    restart: always


  newmicroservice.catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/udemyTenant 
      - IdentityOption:Issuer=http://keycloak:8080/realms/udemyTenant
      - MongoOption:ConnectionString=mongodb://myuser:Password12@mongo.db.catalog:27017 
    ports:
      - "8080"
    depends_on:
      - mongo.db.catalog
      - rabbitmq
    restart: always


  newmicroservice.discount.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/udemyTenant 
      - IdentityOption:Issuer=http://keycloak:8080/realms/udemyTenant
      - MongoOption:ConnectionString=mongodb://myuser:Password12@mongo.db.discount:27017
    ports:
      - "8080"
    depends_on:
      - mongo.db.discount
      - rabbitmq
    restart: always


  newmicroservice.file.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/udemyTenant 
      - IdentityOption:Issuer=http://keycloak:8080/realms/udemyTenant
    ports:
      - "8080"
    restart: always
    depends_on:
      - rabbitmq


  newmicroservice.gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - IdentityOption:Address=http://keycloak:8080/realms/udemyTenant 
      - IdentityOption:Issuer=http://keycloak:8080/realms/udemyTenant
    ports:
      - "8080"
    restart: always


  newmicroservice.order.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/udemyTenant 
      - IdentityOption:Issuer=http://keycloak:8080/realms/udemyTenant
      - AddressUrlOption:PaymentUrl=http://newmicroservice.payment.api:8080
      - ConnectionStrings:SqlServer=Server=sqlserver.db.order,1433;Database=OrderDockerDb;User=Sa;Password=Password12*;Trusted_Connection=False;TrustServerCertificate=True;Integrated Security=False
    ports:
      - "8080"
    depends_on:
      - sqlserver.db.order
      - rabbitmq
    restart: always

  newmicroservice.payment.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/udemyTenant 
      - IdentityOption:Issuer=http://keycloak:8080/realms/udemyTenant
    ports:
      - "8080"
    restart: always
    depends_on:
      - rabbitmq


  newmicroservice.web:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - MicroserviceOption:Catalog:BaseAddress=http://newmicroservice.catalog.api:8080
      - MicroserviceOption:File:BaseAddress=http://newmicroservice.file.api:8080
      - MicroserviceOption:Basket:BaseAddress=http://newmicroservice.basket.api:8080
      - MicroserviceOption:Discount:BaseAddress=http://newmicroservice.discount.api:8080
      - MicroserviceOption:Order:BaseAddress=http://newmicroservice.order.api:8080
      - GatewayOption:BaseAddress=http://newmicroservice.gateway:8080
      - IdentityOption:Address=http://keycloak:8080/realms/udemyTenant
      - IdentityOption:BaseAddress=http://keycloak:8080
    ports:
      - "5050:8080"
    restart: always
    

